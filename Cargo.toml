[package]
name = "jblock"
version = "0.1.0"
edition = "2021"
description = "Java thread dump parser and analyzer compiled to WebAssembly"
license = "MIT"
repository = "https://github.com/zenuo/jblock"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
regex = "1"
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["console_error_panic_hook"]

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
