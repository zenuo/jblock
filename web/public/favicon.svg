<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="jblock">
  <defs>
    <linearGradient id="bg" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Brand tile -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <!-- Two interlocking thread blocks (blocked / waiting) -->
  <rect x="6.5" y="7" width="11" height="8" rx="2" fill="#fff" opacity="0.95"/>
  <rect x="14.5" y="17" width="11" height="8" rx="2" fill="#fff" opacity="0.78"/>
  <!-- Wait-for edge between blocks -->
  <path
    d="M12 15v3.5h8"
    fill="none"
    stroke="#e0e7ff"
    stroke-width="1.75"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M18.2 16.8 L20.5 18.5 L18.2 20.2"
    fill="none"
    stroke="#e0e7ff"
    stroke-width="1.75"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
